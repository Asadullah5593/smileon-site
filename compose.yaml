services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      # utf8mb4 end to end — patient names and treatment copy are not ASCII.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Sized to the memory limit below; the default 128M buffer pool would
      # leave most of it unused.
      - --innodb-buffer-pool-size=512M
      - --max-connections=100
    environment:
      MYSQL_DATABASE: smileon
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `connection_limit` must stay well under the server's max-connections,
      # since every app instance opens its own pool.
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/smileon?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your environment}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STORAGE_DRIVER: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set to 1 on a first deploy to create the permissions, system roles and
      # the first admin account.
      RUN_SEED: ${RUN_SEED:-0}
    ports:
      - "3000:3000"
    volumes:
      # The local storage driver writes here. Switch to S3 before running more
      # than one replica — this volume is per-host, and so is the in-memory
      # rate limiter.
      - uploads:/app/public/uploads
    # Give in-flight requests time to finish on `docker compose down`.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  db-data:
  uploads:
