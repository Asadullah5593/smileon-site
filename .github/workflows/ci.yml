name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:smileon@127.0.0.1:3306/smileon_ci
      AUTH_SECRET: ci-secret-value-at-least-16-chars
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: smileon
          MYSQL_DATABASE: smileon_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psmileon"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reuse the compiled output between runs; the cache key changes whenever
      # source or lockfile does.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npx prisma migrate deploy

      # Catches a schema.prisma edit that was never turned into a migration —
      # the failure mode is a deploy that works locally and breaks in production.
      - name: Check for schema drift
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run db:seed
      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Advisory, not blocking: a new high-severity advisory in a transitive
      # dependency shouldn't wedge every PR. See "Known advisories" in the
      # README for the one currently outstanding.
      - run: npm audit --audit-level=high || true

  image:
    # Proves the Dockerfile still builds — including that it needs no database,
    # which it did not before (the build died prerendering `/`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # A real .env, so the next step proves .dockerignore keeps it out rather
      # than passing because there was nothing to leak.
      - name: Plant a decoy secret
        run: printf 'AUTH_SECRET=leaked-canary-value\nDATABASE_URL=mysql://a:b@h/db\n' > .env

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: smileon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: No secrets in the image
        run: |
          if docker run --rm --entrypoint sh smileon:ci -c \
               'find / -name ".env" -not -path "*/node_modules/*" 2>/dev/null' | grep -q .; then
            echo "::error::A .env file reached the image — check .dockerignore"
            exit 1
          fi
          if docker run --rm --entrypoint sh smileon:ci -c \
               'grep -rl "leaked-canary-value" /app 2>/dev/null' | grep -q .; then
            echo "::error::Build secret leaked into an image layer"
            exit 1
          fi
          echo "No secrets found in the image."

      - name: Image starts as non-root and serves liveness
        run: |
          test "$(docker run --rm --entrypoint sh smileon:ci -c 'id -un')" = "nextjs"
          # No database here, so migrations will fail — that is the point: the
          # entrypoint must refuse to start the server rather than serve against
          # an unmigrated schema.
          if docker run --rm -e DATABASE_URL="mysql://none:none@127.0.0.1:3306/none" \
               -e AUTH_SECRET=ci-secret-value-at-least-16-chars smileon:ci; then
            echo "::error::Entrypoint started the server despite failing migrations"
            exit 1
          fi
          echo "Entrypoint correctly refused to start."
